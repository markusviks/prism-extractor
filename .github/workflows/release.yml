name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      # python.org's installer is a universal2 build, so the app runs on Apple silicon and Intel Macs.
      - name: Install universal2 Python
        run: |
          curl -fsSLO https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg python-3.12.10-macos11.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv .venv

      - name: Test
        run: |
          .venv/bin/pip install -q -r requirements.txt pytest
          .venv/bin/python -m pytest -q

      - name: Build app
        run: ./build_app.sh universal2

      - name: Zip app
        run: ditto -c -k --keepParent "dist/Prism Extractor.app" Prism-Extractor-macOS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Prism-Extractor-macOS
          path: Prism-Extractor-macOS.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Prism-Extractor-macOS.zip --title "Prism Extractor $GITHUB_REF_NAME" --generate-notes
